[package]
name = "kstart"
version = "0.1.0"
edition = "2021"
description = "快速启动 5 (KStart 5) 1:1 像素级复刻版 (Rust)"

[dependencies]
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "png", "jpeg"] }
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Storage_FileSystem", "Win32_UI_Shell"] }
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Memory",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Shutdown",
    "Win32_System_Threading",
    "Win32_Security_Cryptography",
    "Win32_Globalization",
    "Win32_Media_Multimedia",
    "Win32_Networking_WinHttp",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
] }
